:6px;margin:12px 0}.tabs button{flex:1;padding:10px 5px}.tabs button[aria-selected=true]{background:var(--blue);color:white}.viewport{overflow:hidden;touch-action:pan-y}.track{display:flex;transition:transform .28s ease}.panel{flex:0 0 100%;min-width:0;padding:0 2px}.photo{width:80px;height:65px;border:1px dashed #8aa7bf;background:#e9f0f8;display:grid;place-items:center;font-size:12px}.camera{height:190px;border:1px dashed #8aa7bf;display:grid;place-items:center;background:#e9f0f8;margin:12px 0}.note{font-size:12px;color:#65758b;margin:18px 0}.dialog{width:min(92vw,420px);border:1px solid var(--line);border-radius:8px;padding:22px}dialog::backdrop{background:#13223866}.hidden{display:none!important}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.toolbar button{font-size:13px}details{margin:12px 0}summary{cursor:pointer}a{color:var(--blue)}@media(prefers-reduced-motion:reduce){.track{transition:none}}

<body>
<header><div class="row between"><button id="back" aria-label="Volver">←</button><div class="grow"><div class="brand"><b>ARCH</b>FORMS</div><small id="heading" style="color:#dbe9f5">Borrador de navegación</small></div><button id="person" aria-label="Mi perfil"><svg width="22" height="24" viewBox="0 0 24 26" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="7" r="4"/><path d="M4 24v-4a8 8 0 0 1 16 0v4Z"/></svg></button></div></header>
<main id="app" class="screen"></main>
<footer id="dock" class="dock"><div><button onclick="go('newCase')">Nuevo expediente</button><button class="primary" onclick="go('pick')">Nueva visita</button></div></footer>
<dialog id="dialog" class="dialog"></dialog>
<script>
// Prototipo autónomo: datos ficticios, solo en memoria; no conecta con la aplicación.
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let works=[{id:1,name:'Edificio Los Olivos',number:'EXP-2026-084',address:'Av. Los Olivos 450 · Surco',owner:'Inmobiliaria Los Olivos',last:3,template:1},{id:2,name:'Vivienda Las Acacias',number:'EXP-2026-061',address:'Jr. Las Acacias 128 · San Borja',owner:'María Torres',last:2,template:1},{id:3,name:'Local comercial San Miguel',number:'EXP-2026-097',address:'Av. La Marina 820 · San Miguel',owner:'Comercial Rivera',last:0,template:2}];
let visits=[{id:1,work:1,n:3,field:false,pdf:false,date:'Hoy',photos:2,observation:'Revisar acabado del muro del primer nivel.',conclusions:''},{id:2,work:2,n:2,field:true,pdf:false,date:'12 nov 2026',photos:3,observation:'Verificar instalaciones antes de cerrar el muro.',conclusions:''}];
let templates=[{id:1,name:'Inspección municipal habitual',sections:3,own:true},{id:2,name:'Verificación técnica de obra',sections:4,own:false},{id:3,name:'Supervisión general',sections:3,own:false}];
let profile={name:'',role:'',license:'',image:''},route='home',history=[],workId=1,visitId=1,tab=0,templateGroup='mine',editingTemplate=null,templateReturn=false,caseDraft={},recording=false;
const work=()=>works.find(w=>w.id===workId),visit=()=>visits.find(v=>v.id===visitId);
function go(next){history.push(route);route=next;render();window.scrollTo(0,0)}
function back(){if(route==='templateEdit'&&templateReturn){route='newCase';templateReturn=false}else route=history.pop()||'home';render();window.scrollTo(0,0)}
$('back').onclick=back;$('person').onclick=()=>go('profile');
function card(w,action){return `<button class="list" onclick="${action}"><strong>${esc(w.name)}</strong><b>${esc(w.number)}</b><span class="muted">${esc(w.address)}</span><small>Propietario: ${esc(w.owner)}</small></button>`}
function ordered(){return [...works].sort((a,b)=>b.last-a.last)}
function openWork(id){workId=id;go('case')}
function openVisit(id,target='field'){visitId=id;workId=visit().work;tab=0;go(target)}
function pending(v){return !v.pdf}
function status(v){return v.pdf?'PDF generado':v.field?'Campo terminado · pendiente de PDF':'Trabajo de campo pendiente'}
function visitRow(v){const w=works.find(w=>w.id===v.work);return `<button class="list" onclick="openVisit(${v.id},'${v.field?'report':'field'}')"><strong>${esc(w.name)} · Visita ${v.n}</strong><b>${esc(w.number)}</b><small>${esc(v.date)}</small><span class="badge">${status(v)}</span><small>${v.field?'Corregir reporte →':'Continuar visita →'}</small></button>`}
function modal(html){$('dialog').innerHTML=html;$('dialog').showModal()}
function pickWork(id){workId=id;const unfinished=visits.filter(v=>v.work===id&&pending(v));if(unfinished.length){modal(`<h2>Hay una visita pendiente</h2><p>${esc(work().name)} · ${esc(work().number)}</p><p>Visita ${unfinished[0].n}: ${status(unfinished[0])}.</p><p>¿Quieres continuarla o crear otra visita?</p><div class="toolbar"><button onclick="$('dialog').close()">Cancelar</button><button onclick="$('dialog').close();openVisit(${unfinished[0].id},'${unfinished[0].field?'report':'field'}')">Continuar pendiente</button><button class="primary" onclick="$('dialog').close();createVisit()">Crear otra visita</button></div>`)}else createVisit()}
function createVisit(){const n=Math.max(0,...visits.filter(v=>v.work===workId).map(v=>v.n))+1;const v={id:Date.now(),work:workId,n,field:false,pdf:false,date:'Hoy',photos:0,observation:'',conclusions:''};visits.push(v);work().last=Math.max(...works.map(w=>w.last))+1;visitId=v.id;tab=0;go('field')}
function render(){
 $('dock').classList.toggle('hidden',route!=='home');$('back').classList.toggle('hidden',route==='home');$('person').classList.toggle('hidden',route==='onboarding');$('heading').textContent=({home:'Tu espacio',pick:'Nueva visita',newCase:'Nuevo expediente',cases:'Mis expedientes',case:'Detalle de obra',field:'Trabajo de campo',report:'Editor del informe',templates:'Plantillas',templateEdit:'Editor de plantilla',profile:'Mi perfil',menu:'Más opciones',onboarding:'Bienvenida'})[route];
 document.body.classList.toggle('home-mode',route==='home');if(route==='home')$('heading').textContent='Hola, '+(profile.name||'Lucía');
 const screens={home:homeScreen,pick:pickScreen,newCase:caseForm,cases:casesScreen,case:caseScreen,field:fieldScreen,report:reportScreen,templates:templatesScreen,templateEdit:templateScreen,profile:profileScreen,menu:menuScreen,onboarding:onboardingScreen,pending:pendingScreen};$('app').innerHTML=screens[route]();if(route==='field')setTab(tab);
}
function icon(name){const paths={works:'<path d="M4 21V7l8-4 8 4v14M9 21v-5h6v5M8 8h2m4 0h2M8 12h2m4 0h2M2 21h20"/>',pending:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6m-6 4h6m-6 4h3"/>',templates:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m7 8 1 1 2-2m2 1h5M7 13h2m3 0h5m-10 4h2m3 0h5"/>',more:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/>',spark:'<path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3ZM20 2v4m-2-2h4"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`}
function homeScreen(){const count=visits.filter(pending).length;return `
 <section class="home-top"><div class="home-top-inner">
 <p class="home-caption">Tu próxima visita, tu próximo informe.</p>
 <div class="home-layout"><div>
 <div class="desktop-intro"><h1>Tu espacio de trabajo</h1><p>Todo lo que necesitas, de la inspección al reporte.</p></div>
 <nav class="quick-grid" aria-label="Accesos rápidos">
 <button class="quick-item" onclick="go('cases')"><span class="quick-icon">${icon('works')}</span><span>Mis<br> expedientes</span></button>
 <button class="quick-item" onclick="go('pending')"><span class="quick-icon count-icon">${icon('pending')}${count?`<span class="quick-count">${count}</span>`:''}</span><span>Visitas<br> pendientes</span></button>
 <button class="quick-item" onclick="go('templates')"><span class="quick-icon">${icon('templates')}</span><span>Mis<br> plantillas</span></button>
 <button class="quick-item" onclick="go('menu')"><span class="quick-icon">${icon('more')}</span><span>Ver<br> más</span></button>
 </nav></div>
 <aside class="news-card" aria-label="Novedades de nuestras aplicaciones"><div class="grow"><span class="news-tag">Novedades · ArchForms</span><strong>Más tiempo en obra.<br>Menos tiempo redactando.</strong><p>Aquí irán nuestras nuevas herramientas.</p></div><span class="news-art">${icon('spark')}</span></aside>
 </div></div></section>
 <section class="home-bottom" aria-labelledby="recent-title"><div class="recent-heading"><h2 id="recent-title">Últimas obras visitadas</h2><button onclick="go('cases')">Ver todas →</button></div>
 <div class="recent-list">${ordered().filter(w=>w.last>0).slice(0,2).map(w=>`<button class="recent-work" onclick="openWork(${w.id})"><span class="work-symbol">${icon('works')}</span><span><strong>${esc(w.name)}</strong><b>${esc(w.number)}</b></span><span class="arrow">›</span></button>`).join('')||'<p class="pending-counter">Tus obras aparecerán aquí después de tu primera visita.</p>'}</div>
 <p class="home-footnote">Prototipo navegable · datos de ejemplo</p></section>`}
function pendingScreen(){return `<h1>Visitas pendientes</h1><p>Continúa el trabajo en campo o corrige el informe antes de generar el PDF.</p>${visits.filter(pending).map(visitRow).join('')||'<p class="card">No tienes visitas pendientes.</p>'}`}
function pickScreen(){return `<h1>¿Qué obra vas a visitar?</h1><p>Al tocar una obra se crea y abre una nueva visita.</p><input type="search" placeholder="Buscar obra, expediente o dirección" aria-label="Buscar obra" oninput="filterWorks(this.value)"><div id="work-results">${ordered().map(w=>card(w,`pickWork(${w.id})`)).join('')}</div><p class="note">Ordenadas por la visita realizada más recientemente.</p><button onclick="go('newCase')">＋ No está aquí: crear expediente</button>`}
function filterWorks(text){text=text.toLowerCase();$('work-results').innerHTML=ordered().filter(w=>`${w.name} ${w.number} ${w.address}`.toLowerCase().includes(text)).map(w=>card(w,`pickWork(${w.id})`)).join('')||'<p>No hay coincidencias.</p>'}
function casesScreen(){return `<h1>Mis expedientes</h1><p>Administración de obras e historial de visitas.</p><button onclick="go('newCase')">＋ Nuevo expediente</button>${ordered().map(w=>card(w,`openWork(${w.id})`)).join('')}`}
function caseScreen(){const w=work();return `<h1>${esc(w.name)}</h1><b>${esc(w.number)}</b><p>${esc(w.address)}</p><small>Propietario: ${esc(w.owner)}</small><div class="card"><small>Plantilla del expediente</small><p>${esc(templates.find(t=>t.id===w.template)?.name||'Inspección municipal habitual')}</p></div><button class="primary" onclick="pickWork(${w.id})">＋ Nueva visita en esta obra</button><h2>Visitas de la obra</h2>${visits.filter(v=>v.work===w.id).map(visitRow).join('')||'<p>Todavía no hay visitas.</p>'}`}
function caseForm(){return `<h1>Configurar una obra</h1><p>Se hace una vez. Después solo creas nuevas visitas.</p><form onsubmit="saveCase(event)"><label><span>Nombre de la obra *</span><input required name="name" value="${esc(caseDraft.name)}" oninput="caseDraft.name=this.value"></label><label><span>Número de expediente *</span><input required name="number" value="${esc(caseDraft.number)}" oninput="caseDraft.number=this.value"></label><label><span>Dirección *</span><input required name="address" value="${esc(caseDraft.address)}" oninput="caseDraft.address=this.value"></label><label><span>Propietario</span><input name="owner" value="${esc(caseDraft.owner)}" oninput="caseDraft.owner=this.value"></label><details><summary>Licencia, responsables, póliza y planificación</summary><p class="note">Agrupación propuesta para los datos secundarios del expediente.</p><label>Número de licencia<input></label><label>Responsable de obra<input></label><label>Visitas programadas<input type="number" min="1"></label></details><h2>Plantilla de esta obra</h2><p class="muted">Se copiará a cada nueva visita; las visitas anteriores no cambian.</p><select aria-label="Plantilla de esta obra" onchange="caseDraft.template=Number(this.value)">${templates.map(t=>`<option value="${t.id}" ${Number(caseDraft.template||1)===t.id?'selected':''}>${esc(t.name)} · ${t.sections} secciones</option>`).join('')}</select><button type="button" class="link" onclick="templateReturn=true;editingTemplate=null;go('templateEdit')">＋ Crear una plantilla</button><div class="card"><small>Vista previa simplificada</small><p>Documentación · condiciones de obra · avance de obra</p></div><button class="primary" type="submit">Crear expediente</button></form><p class="note">Este borrador simplifica los datos administrativos; no propone eliminarlos de la aplicación.</p>`}
function saveCase(e){e.preventDefault();const w={id:Date.now(),name:caseDraft.name,number:caseDraft.number,address:caseDraft.address,owner:caseDraft.owner||'',last:0,template:Number(caseDraft.template||1)};works.push(w);workId=w.id;caseDraft={};go('case')}
function fieldScreen(){const v=visit();return `<h1>${esc(work().name)}</h1><b>${esc(work().number)} · Visita ${v.n}</b><small>${status(v)}</small><div class="tabs" role="tablist" aria-label="Secciones de visita">${['Plantilla','Captura','Resumen'].map((s,i)=>`<button role="tab" id="tab-${i}" aria-selected="${tab===i}" onclick="setTab(${i})">${s}</button>`).join('')}</div><div class="viewport" id="swipe"><div class="track" id="track"><section class="panel" id="panel-0"><h2>Plantilla de la visita</h2><p class="muted">Completa la revisión antes de registrar hallazgos.</p><div class="card"><h3>Documentación y condiciones</h3><label>Licencia disponible<select onchange="changed()"><option>Sin responder</option><option>Sí</option><option>No</option><option>No aplica</option></select></label><label>Trabajos conforme a planos<select onchange="changed()"><option>Sin responder</option><option>Sí</option><option>No</option><option>No aplica</option></select></label><label>Avance de obra (%)<input type="number" min="0" max="100" oninput="changed()"></label><small>Guardado simulado en este dispositivo</small></div><button class="primary" onclick="setTab(1)">Ir a captura →</button></section><section class="panel" id="panel-1"><h2>Fotos y observaciones</h2><div class="camera">Visor de cámara · simulado</div><div class="row wrap"><button onclick="visit().photos++;changed();render()">＋ Tomar foto</button><button class="primary" onclick="recording=!recording;if(!recording){visit().observation='Observación dictada de ejemplo: revisar el acabado del muro.';changed()}render()">${recording?'■ Detener y guardar hallazgo':'● Grabar observación'}</button></div><p>${v.photos} fotografías de ejemplo</p><label>Observación de muestra<textarea oninput="visit().observation=this.value;changed()">${esc(v.observation)}</textarea></label><small>En la app real, el audio delimita cada grupo de fotos.</small><button class="primary" onclick="setTab(2)">Revisar resumen →</button></section><section class="panel" id="panel-2"><h2>Resumen de la visita</h2><details class="card"><summary>Cabecera de la obra</summary><p>${esc(work().number)} · ${esc(work().address)}</p></details><details class="card"><summary>Respuestas de la plantilla</summary><p>Revisión de las respuestas registradas en la primera pestaña.</p></details><div class="card"><h3>Hallazgos</h3><div class="row wrap">${Array.from({length:Math.min(v.photos,5)},(_,i)=>`<span class="photo">Foto ${i+1}</span>`).join('')}</div><p>${esc(v.observation||'Aún no hay observaciones.')}</p></div><label>Conclusiones<textarea oninput="visit().conclusions=this.value;changed()">${esc(v.conclusions)}</textarea></label>${signers()}<div class="card"><h3>${v.field?'Campo terminado':'¿Terminaste el trabajo en campo?'}</h3><p>Concluir no genera el PDF. Puedes revisar la redacción del informe después.</p>${v.field?'<button class="primary" onclick="go(\'report\')">Editar informe →</button>':'<button class="primary" onclick="finishField()">Concluir trabajo de campo</button>'}</div></section></div></div><p class="note">Desliza horizontalmente o toca las pestañas. Captura, audio y guardado son simulaciones.</p>`}
function setTab(i){tab=i;const track=$('track');if(!track)return;track.style.transform=`translateX(-${i*100}%)`;for(let n=0;n<3;n++){$('tab-'+n).setAttribute('aria-selected',n===i);$('panel-'+n).inert=n!==i}track.style.height=$('panel-'+i).scrollHeight+'px';let start=null;$('swipe').onpointerdown=e=>{if(e.target.closest('input,textarea,select,button'))return;start={x:e.clientX,y:e.clientY}};$('swipe').onpointerup=e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5)setTab(Math.max(0,Math.min(2,tab+(dx<0?1:-1))))}}
window.addEventListener('resize',()=>{if(route==='field')setTab(tab)});
function changed(){visit().pdf=false}
function signers(){return `<div class="card"><h3>Firmantes y firmas</h3><p>Identidad y espacio para firmar el reporte impreso.</p><label>Inspector<input placeholder="Nombre del inspector" value="${esc(profile.name)}"></label><label>Colegiatura<input value="${esc(profile.license)}"></label><label>Responsable de obra<input placeholder="Nombre del responsable"></label><label>Modalidad<select><option>En papel</option><option>Con imagen de firma</option></select></label><button onclick="modal('<h2>Imagen de firma</h2><p>En la aplicación se podrá adjuntar una imagen o tomar una foto, revisarla y repetirla.</p><button onclick=\"$(\'dialog\').close()\">Cerrar</button>')">Adjuntar / tomar foto [muestra]</button></div>`}
function finishField(){visit().field=true;render();modal('<h2>Trabajo de campo terminado</h2><p>La visita sigue pendiente de generar PDF. Puedes revisar el informe ahora o hacerlo después desde Inicio.</p><div class="toolbar"><button onclick="$(\'dialog\').close();go(\'home\')">Volver al inicio</button><button class="primary" onclick="$(\'dialog\').close();go(\'report\')">Revisar informe</button></div>')}
function reportScreen(){const v=visit();return `<h1>Informe · Visita ${v.n}</h1><b>${esc(work().name)}</b><p>${esc(work().number)}</p><span class="badge">${status(v)}</span><p class="muted">El informe ya está armado. Revisa la redacción y las firmas antes de imprimir.</p><details class="card"><summary>Cabecera</summary><p>${esc(work().address)}</p></details><details class="card"><summary>Plantilla y respuestas</summary><p>En la app real puedes corregir respuestas y editar los campos de esta visita.</p><button onclick="openVisit(${v.id})">Revisar plantilla</button></details><div class="card"><h2>Hallazgos</h2><small>${v.photos} fotografías incluidas</small><label>Redacción de la observación<textarea oninput="visit().observation=this.value;changed()">${esc(v.observation)}</textarea></label><div class="toolbar"><button onclick="demo('Mover bloque')">↑</button><button onclick="demo('Mover bloque')">↓</button><button onclick="demo('Seleccionar y ordenar fotografías')">Organizar fotos</button><button onclick="addText()">＋ Texto</button></div><div id="extra-text"></div></div><label>Conclusiones<textarea oninput="visit().conclusions=this.value;changed()">${esc(v.conclusions)}</textarea></label>${signers()}<small>Guardado local simulado · sin conexión con Supabase</small><div class="toolbar"><button onclick="go('home')">Continuar después</button><button class="primary" onclick="generatePdf()">Generar PDF</button></div><p class="note">Generar PDF no marca el documento como impreso ni firmado.</p>`}
function demo(action){modal(`<h2>${esc(action)}</h2><p>Acción representada para revisar su ubicación. La edición avanzada se conserva en la aplicación real.</p><button onclick="$('dialog').close()">Cerrar</button>`)}
function addText(){$('extra-text').insertAdjacentHTML('beforeend','<label>Texto adicional<textarea placeholder="Escribe una nota…"></textarea></label>')}
function generatePdf(){visit().pdf=true;modal('<h2>PDF generado · simulación</h2><p>En la aplicación se descargará o se guardará en el dispositivo para abrirlo, compartirlo e imprimirlo.</p><p>No se ha creado un archivo real en este prototipo.</p><div class="toolbar"><button onclick="demo(\'Abrir / compartir PDF\')">Abrir / compartir [muestra]</button><button class="primary" onclick="$(\'dialog\').close();go(\'home\')">Volver al inicio</button></div>')}
function templatesScreen(){const mine=templateGroup==='mine';return `<h1>Plantillas</h1><p>Define qué revisarás en cada visita de obra.</p><div class="tabs"><button class="${mine?'primary':''}" onclick="templateGroup='mine';render()">Mis plantillas</button><button class="${!mine?'primary':''}" onclick="templateGroup='platform';render()">Predeterminadas</button></div><small>${mine?'Puedes editar tus plantillas sin cambiar las visitas existentes.':'Son de la plataforma. Duplícalas para crear tu propia versión.'}</small><div class="toolbar"><button onclick="editingTemplate=null;go('templateEdit')">＋ Crear plantilla</button></div>${templates.filter(t=>t.own===mine).map(t=>`<div class="card row between"><button class="link grow" style="text-align:left" onclick="previewTemplate(${t.id})"><strong>${esc(t.name)}</strong><small>${t.sections} secciones</small></button><button onclick="editTemplate(${t.id},${!mine})">${mine?'Editar':'Duplicar y editar'}</button></div>`).join('')||'<p>No tienes plantillas propias.</p>'}`}
function previewTemplate(id){const t=templates.find(t=>t.id===id);modal(`<h2>${esc(t.name)}</h2><p>${t.sections} secciones · vista previa de ejemplo</p><label>Licencia disponible<select disabled><option>Sí / No / No aplica</option></select></label><label>Avance de obra<input disabled placeholder="0–100 %"></label><div class="toolbar"><button onclick="$('dialog').close()">Volver</button><button class="primary" onclick="$('dialog').close();editTemplate(${id},${!t.own})">${t.own?'Editar':'Duplicar y editar'}</button></div>`)}
function editTemplate(id,duplicate){const t=templates.find(t=>t.id===id);editingTemplate={...t,...(duplicate?{id:null,name:t.name+' · copia'}:{})};go('templateEdit')}
function templateScreen(){return `<h1>${editingTemplate?.id?'Editar':'Crear'} plantilla</h1><p>Una lista compacta de secciones y preguntas para tus visitas.</p><form onsubmit="saveTemplate(event)"><label>Título *<input required name="name" value="${esc(editingTemplate?.name||'')}"></label><div id="sections"><div class="card"><label>Sección 1<input value="Documentación"></label><label>Pregunta<input value="Licencia de edificación disponible"></label><select aria-label="Tipo de respuesta"><option>Sí / No / No aplica</option><option>Texto corto</option><option>Párrafo</option><option>Número</option><option>Porcentaje</option><option>Fecha</option><option>Lista de opciones</option></select><button type="button" class="link" onclick="this.insertAdjacentHTML('beforebegin','<label>Nueva pregunta<input placeholder=\"Título de la pregunta\"></label>')">＋ Pregunta</button></div></div><button type="button" onclick="addSection()">＋ Sección</button><div class="card"><small>Campo de sistema · no editable</small><p>Avance de obra (%)</p></div><button class="primary" type="submit">${templateReturn?'Guardar y volver al expediente':'Guardar plantilla'}</button></form><p class="note">Editor simplificado para validar distribución, no configuración completa.</p>`}
function addSection(){$('sections').insertAdjacentHTML('beforeend','<div class="card"><label>Nombre de sección<input placeholder="Nueva sección"></label><label>Pregunta<input placeholder="Título de la pregunta"></label></div>')}
function saveTemplate(e){e.preventDefault();const name=new FormData(e.target).get('name'),id=editingTemplate?.id||Date.now();const t={id,name,own:true,sections:Math.max(editingTemplate?.sections||0,$('sections').children.length)};templates=templates.filter(x=>x.id!==id);templates.push(t);if(templateReturn){caseDraft.template=id;templateReturn=false;go('newCase')}else{templateGroup='mine';go('templates')}}
function profileScreen(){return `<h1>Mi perfil</h1><p>Datos reutilizables en tus reportes. Todos son opcionales en este borrador.</p>${profileForm(false)}<button class="link" onclick="modal('<h2>Cerrar sesión</h2><p>Acción simulada: el prototipo no tiene autenticación.</p><button onclick=\"$(\'dialog\').close()\">Cerrar</button>')">Cerrar sesión</button>`}
function profileForm(onboarding){return `<form onsubmit="saveProfile(event,${onboarding})"><label>Nombre<input name="name" value="${esc(profile.name)}"></label><label>Colegiatura<input name="license" value="${esc(profile.license)}"></label><label>Cargo<input name="role" value="${esc(profile.role)}"></label><details><summary>Firma [opcional]</summary><label>Adjuntar imagen<input type="file" accept="image/*" onchange="previewSignature(this)"></label><div id="signature-preview"></div><button type="button" onclick="demo('Tomar foto de firma')">Tomar foto [muestra]</button></details><div class="toolbar">${onboarding?'<button type="button" onclick="go(\'home\')">Omitir</button>':''}<button class="primary">${onboarding?'Guardar y continuar':'Guardar perfil'}</button></div></form>`}
function previewSignature(input){if(!input.files[0])return;const reader=new FileReader();reader.onload=()=>{$('signature-preview').innerHTML=`<img alt="Vista previa de firma" style="max-width:200px;max-height:75px" src="${reader.result}">`};reader.readAsDataURL(input.files[0])}
function saveProfile(e,onboarding){e.preventDefault();const f=new FormData(e.target);profile={...profile,name:f.get('name'),license:f.get('license'),role:f.get('role')};if(onboarding)go('home');else modal('<h2>Perfil guardado · simulación</h2><p>Datos conservados solo durante esta sesión del prototipo.</p><button onclick="$(\'dialog\').close()">Continuar</button>')}
function onboardingScreen(){return `<h1>Tus datos para los reportes</h1><p>Puedes completarlos ahora o después desde el icono de persona. Todo es opcional.</p>${profileForm(true)}<p class="note">Después vas directamente al inicio. El tutorial se diseñará más adelante.</p>`}
function menuScreen(){return `<h1>Más opciones</h1><button class="list" onclick="go('cases')">Mis expedientes →</button><button class="list" onclick="go('templates')">Mis plantillas →</button><button class="list" onclick="go('profile')">Mi perfil y firma →</button><p class="note">La configuración no compite con las dos acciones principales del inicio.</p>`}
render();
</script>
</body>
</html>
